
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <meta name="description" content="Souqna - Buy and sell new and used products in the UAE. سوقنا للبيع والشراء في الإمارات">
  <title>Souqna | سوقنا</title>
  <style>
    :root {
      --green: #087f5b;
      --green-dark: #056747;
      --bg: #f4f7f6;
      --white: #ffffff;
      --text: #172522;
      --muted: #647570;
      --border: #dce7e2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    button, input, select { font: inherit; }

    button { cursor: pointer; }

    .topbar {
      background: var(--white);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--green);
      font-weight: 800;
      font-size: 23px;
      text-decoration: none;
    }

    .lang-btn {
      border: 1px solid var(--green);
      border-radius: 9px;
      color: var(--green);
      background: white;
      padding: 8px 14px;
      font-weight: 700;
    }

    .hero {
      background: linear-gradient(135deg, #087f5b, #075c48);
      color: white;
      padding: 36px 18px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(27px, 6vw, 38px);
      line-height: 1.3;
      margin: 0 0 12px;
    }

    .hero p {
      margin: 0 auto 20px;
      max-width: 520px;
      opacity: .95;
    }

    .wrap {
      width: min(760px, 100%);
      padding: 18px;
      margin: auto;
    }

    .panel, .product {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 17px;
      box-shadow: 0 4px 15px #14382b08;
    }

    h2 {
      font-size: 21px;
      margin: 0 0 14px;
    }

    .field { margin-bottom: 12px; }

    label {
      display: block;
      font-size: 14px;
      font-weight: 650;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      min-height: 47px;
      border: 1px solid #cbd9d2;
      border-radius: 9px;
      background: white;
      color: var(--text);
      padding: 11px 12px;
    }

    input:focus, select:focus {
      outline: 2px solid #9bd5bd;
      border-color: var(--green);
    }

    .btn {
      width: 100%;
      min-height: 47px;
      padding: 11px 15px;
      border: 0;
      border-radius: 9px;
      background: var(--green);
      color: white;
      font-weight: 750;
    }

    .btn:hover { background: var(--green-dark); }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input { min-width: 0; flex: 1; }

    .search-row .btn { width: auto; }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin: 10px 0 0;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .product {
      margin: 0;
      padding: 14px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .product-icon {
      background: #e8f5ef;
      border-radius: 11px;
      min-height: 85px;
      display: grid;
      place-items: center;
      font-size: 37px;
      margin-bottom: 10px;
    }

    .product h3 {
      font-size: 16px;
      margin: 5px 0;
    }

    .price {
      color: var(--green);
      font-weight: 800;
      font-size: 18px;
    }

    .category {
      font-size: 12px;
      color: var(--muted);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      background: white;
      border: 1px dashed #b9cec4;
      border-radius: 12px;
      padding: 24px 12px;
      color: var(--muted);
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 22px 15px 30px;
    }

    @media (max-width: 380px) {
      .products-grid { grid-template-columns: 1fr; }
      .search-row { flex-direction: column; }
      .search-row .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Souqna home">Souqna | سوقنا</a>
    <button class="lang-btn" id="langToggle" type="button">
      English
    </button>
  </header>

  <section class="hero">
    <h1 data-i18n="heroTitle">كل ما تريد، في سوقنا</h1>
    <p data-i18n="heroText">
      اشترِ وبِع المنتجات الجديدة والمستعملة في الإمارات
    </p>
  </section>

  <main class="wrap">
    <section class="panel">
      <h2 data-i18n="searchTitle">ابحث عن منتج</h2>
      <div class="search-row">
        <input id="searchInput" type="search"
          data-placeholder="searchPlaceholder"
          placeholder="ماذا تريد أن تشتري؟">
        <button class="btn" id="searchBtn" type="button"
          data-i18n="searchBtn">بحث</button>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="postTitle">أضف إعلانك</h2>
      <form id="listingForm">
        <div class="field">
          <label for="productName" data-i18n="nameLabel">اسم المنتج</label>
          <input id="productName" required maxlength="100"
            data-placeholder="namePlaceholder"
            placeholder="مثال: هاتف مستعمل">
        </div>

        <div class="field">
          <label for="productPrice" data-i18n="priceLabel">السعر (درهم)</label>
          <input id="productPrice" type="number" required
            min="0.01" max="100000000" step="0.01"
            placeholder="مثال: 250">
        </div>

        <div class="field">
          <label for="productCategory" data-i18n="categoryLabel">الفئة</label>
          <select id="productCategory">
            <option value="electronics" data-i18n="electronics">إلكترونيات</option>
            <option value="furniture" data-i18n="furniture">أثاث ومنزل</option>
            <option value="fashion" data-i18n="fashion">ملابس وإكسسوارات</option>
            <option value="cars" data-i18n="cars">سيارات</option>
            <option value="other" data-i18n="other">أخرى</option>
          </select>
        </div>

        <button class="btn" type="submit" data-i18n="postBtn">
          نشر الإعلان التجريبي
        </button>
        <p class="hint" data-i18n="demoNote">
          هذه نسخة تجريبية. الإعلانات محفوظة مؤقتًا أثناء فتح الصفحة فقط.
        </p>
      </form>
    </section>

    <section>
      <h2 data-i18n="latestTitle">أحدث الإعلانات</h2>
      <div id="products" class="products-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Souqna | سوقنا</span> © 2026
    <p data-i18n="footerText">سوقك للبيع والشراء في الإمارات</p>
  </footer>

  <script>
    const translations = {
      ar: {
        langButton: "English",
        heroTitle: "كل ما تريد، في سوقنا",
        heroText: "اشترِ وبِع المنتجات الجديدة والمستعملة في الإمارات",
        searchTitle: "ابحث عن منتج",
        searchPlaceholder: "ماذا تريد أن تشتري؟",
        searchBtn: "بحث",
        postTitle: "أضف إعلانك",
        nameLabel: "اسم المنتج",
        namePlaceholder: "مثال: هاتف مستعمل",
        priceLabel: "السعر (درهم)",
        categoryLabel: "الفئة",
        electronics: "إلكترونيات",
        furniture: "أثاث ومنزل",
        fashion: "ملابس وإكسسوارات",
        cars: "سيارات",
        other: "أخرى",
        postBtn: "نشر الإعلان التجريبي",
        demoNote: "هذه نسخة تجريبية. الإعلانات محفوظة مؤقتًا أثناء فتح الصفحة فقط.",
        latestTitle: "أحدث الإعلانات",
        empty: "لا توجد إعلانات بعد. أضف أول إعلان!",
        noResults: "لم نعثر على منتجات تطابق بحثك.",
        invalid: "يرجى إدخال اسم المنتج وسعر صحيح.",
        footerText: "سوقك للبيع والشراء في الإمارات",
        currency: "درهم",
        categories: {
          electronics: "إلكترونيات",
          furniture: "أثاث ومنزل",
          fashion: "ملابس وإكسسوارات",
          cars: "سيارات",
          other: "أخرى"
        }
      },
      en: {
        langButton: "العربية",
        heroTitle: "Everything you need, in one Souq",
        heroText: "Buy and sell new and used products across the UAE",
        searchTitle: "Find a product",
        searchPlaceholder: "What are you looking for?",
        searchBtn: "Search",
        postTitle: "Post your listing",
        nameLabel: "Product name",
        namePlaceholder: "e.g. Used mobile phone",
        priceLabel: "Price (AED)",
        categoryLabel: "Category",
        electronics: "Electronics",
        furniture: "Furniture & Home",
        fashion: "Fashion & Accessories",
        cars: "Cars",
        other: "Other",
        postBtn: "Post demo listing",
        demoNote: "This is a demo. Listings are kept temporarily while this page remains open.",
        latestTitle: "Latest listings",
        empty: "No listings yet. Post the first one!",
        noResults: "No products match your search.",
        invalid: "Please enter a product name and a valid price.",
        footerText: "Your marketplace for buying and selling in the UAE",
        currency: "AED",
        categories: {
          electronics: "Electronics",
          furniture: "Furniture & Home",
          fashion: "Fashion & Accessories",
          cars: "Cars",
          other: "Other"
        }
      }
    };

    let language = "ar";
    let listings = [];
    let currentSearch = "";

    const icons = {
      electronics: "📱",
      furniture: "🛋️",
      fashion: "👕",
      cars: "🚗",
      other: "📦"
    };

    function t(key) {
      return translations[language][key];
    }

    function changeLanguage() {
      language = language === "ar" ? "en" : "ar";
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        element.textContent = t(key);
      });

      document.querySelectorAll("[data-placeholder]").forEach(element => {
        element.placeholder = t(element.dataset.placeholder);
      });

      document.getElementById("langToggle").textContent = t("langButton");
      document.getElementById("searchInput").value = currentSearch;
      renderListings();
    }

    function renderListings() {
      const container = document.getElementById("products");
      container.replaceChildren();

      const term = currentSearch.trim().toLocaleLowerCase();
      const filtered = listings.filter(item => {
        const searchable = (
          item.name + " " +
          translations.ar.categories[item.category] + " " +
          translations.en.categories[item.category]
        ).toLocaleLowerCase();
        return searchable.includes(term);
      });

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = listings.length ? t("noResults") : t("empty");
        container.appendChild(empty);
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "product";

        const icon = document.createElement("div");
        icon.className = "product-icon";
        icon.textContent = icons[item.category];

        const name = document.createElement("h3");
        name.textContent = item.name;

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = new Intl.NumberFormat(
          language === "ar" ? "ar-AE" : "en-AE",
          { maximumFractionDigits: 2 }
        ).format(item.price) + " " + t("currency");

        const category = document.createElement("div");
        category.className = "category";
        category.textContent = t("categories")[item.category];

        card.append(icon, name, price, category);
        container.appendChild(card);
      });
    }

    document.getElementById("langToggle").addEventListener("click", changeLanguage);

    document.getElementById("searchBtn").addEventListener("click", () => {
      currentSearch = document.getElementById("searchInput").value;
      renderListings();
    });

    document.getElementById("searchInput").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        currentSearch = event.target.value;
        renderListings();
      }
    });

    document.getElementById("listingForm").addEventListener("submit", event => {
      event.preventDefault();

      const name = document.getElementById("productName").value.trim();
      const price = Number(document.getElementById("productPrice").value);
      const category = document.getElementById("productCategory").value;

      if (!name || !Number.isFinite(price) || price <= 0) {
        alert(t("invalid"));
        return;
      }

      listings.unshift({ name, price, category });
      currentSearch = "";
      document.getElementById("searchInput").value = "";
      event.target.reset();
      renderListings();
    });

    document.documentElement.lang = "ar";
    document.documentElement.dir = "rtl";
    renderListings();
  </script>
</body>
</html>
