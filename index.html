
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f5b">
<title>Souqna | سوقنا</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#20302a}
header{background:white;padding:16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold;color:#087f5b}
button,.btn{background:#087f5b;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;text-decoration:none}
main{max-width:760px;margin:auto;padding:16px}
.hero{background:#087f5b;color:white;text-align:center;padding:30px 15px}
.panel,.product{background:white;padding:16px;border-radius:12px;margin-bottom:16px;border:1px solid #dce7e2}
input,select,textarea{display:block;width:100%;padding:12px;margin:6px 0 14px;border:1px solid #cbd9d2;border-radius:8px;font:inherit}
label{font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.price{font-weight:bold;color:#087f5b;font-size:20px}
.description{white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:12px}
.actions a{flex:1;text-align:center;font-size:14px}
.call{background:#e8f5ef;color:#087f5b}
.comment{background:#f4f7f6;padding:8px;border-radius:7px;margin:6px 0}
small{color:#647570}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="logo">Souqna | سوقنا</div>
<button id="language">English</button>
</header>

<section class="hero">
<h1 id="heading">كل ما تريد، في سوقنا</h1>
<p id="intro">اشترِ وبِع المنتجات الجديدة والمستعملة في الإمارات</p>
</section>

<main>
<section class="panel">
<h2 id="searchTitle">ابحث عن منتج</h2>
<input id="search" placeholder="ماذا تريد أن تشتري؟">
<button id="searchButton">بحث</button>
</section>

<section class="panel">
<h2 id="formTitle">أضف إعلانك</h2>
<form id="listingForm">
<label id="nameLabel">اسم المنتج</label>
<input id="name" required maxlength="100" placeholder="مثال: هاتف مستعمل">

<label id="imageLabel">صورة المنتج</label>
<input id="photo" type="file" accept="image/*" required>

<label id="phoneLabel">رقم واتساب مع مفتاح الدولة</label>
<input id="phone" type="tel" required placeholder="971501234567">

<label id="priceLabel">السعر بالدرهم</label>
<input id="price" type="number" min="0.01" step="0.01" required placeholder="250">

<label id="categoryLabel">الفئة</label>
<select id="category">
<option value="electronics">إلكترونيات</option>
<option value="furniture">أثاث ومنزل</option>
<option value="fashion">ملابس وإكسسوارات</option>
<option value="cars">سيارات</option>
<option value="other">أخرى</option>
</select>

<label id="descriptionLabel">وصف المنتج</label>
<textarea id="description" required maxlength="1000" placeholder="اكتب تفاصيل المنتج وحالته..."></textarea>

<button id="publish" type="submit">نشر الإعلان</button>
<p><small id="notice">نسخة تجريبية: الإعلانات محفوظة على هذا الجهاز فقط.</small></p>
</form>
</section>

<h2 id="latest">أحدث الإعلانات</h2>
<div id="products" class="grid"></div>
</main>

<footer style="text-align:center;padding:20px">
Souqna | سوقنا © 2026
</footer>

<script>
const $=id=>document.getElementById(id);
let lang="ar",query="";
let listings=[];
try{listings=JSON.parse(localStorage.getItem("souqnaListings")||"[]");if(!Array.isArray(listings))listings=[]}catch(e){listings=[]}

const words={
ar:{
lang:"English",heading:"كل ما تريد، في سوقنا",
intro:"اشترِ وبِع المنتجات الجديدة والمستعملة في الإمارات",
searchTitle:"ابحث عن منتج",search:"ماذا تريد أن تشتري؟",
searchButton:"بحث",formTitle:"أضف إعلانك",nameLabel:"اسم المنتج",
imageLabel:"صورة المنتج",phoneLabel:"رقم واتساب مع مفتاح الدولة",
priceLabel:"السعر بالدرهم",categoryLabel:"الفئة",
descriptionLabel:"وصف المنتج",publish:"نشر الإعلان",
notice:"نسخة تجريبية: الإعلانات محفوظة على هذا الجهاز فقط.",
latest:"أحدث الإعلانات",empty:"لا توجد إعلانات بعد.",
whatsapp:"اسأل عبر واتساب",call:"اتصال",comments:"الأسئلة والتعليقات",
commentPlaceholder:"اكتب سؤالك عن المنتج...",commentButton:"أضف تعليقًا",
noComments:"لا توجد أسئلة بعد.",categories:["إلكترونيات","أثاث ومنزل","ملابس وإكسسوارات","سيارات","أخرى"],
invalid:"يرجى التأكد من جميع البيانات ورقم الهاتف.",
big:"الصورة أكبر من 2 ميغابايت. اختر صورة أصغر."
},
en:{
lang:"العربية",heading:"Everything you need, in one Souq",
intro:"Buy and sell new and used products across the UAE",
searchTitle:"Find a product",search:"What are you looking for?",
searchButton:"Search",formTitle:"Post your listing",nameLabel:"Product name",
imageLabel:"Product photo",phoneLabel:"WhatsApp number with country code",
priceLabel:"Price (AED)",categoryLabel:"Category",
descriptionLabel:"Product description",publish:"Publish listing",
notice:"Demo version: listings are saved on this device only.",
latest:"Latest listings",empty:"No listings yet.",
whatsapp:"Ask on WhatsApp",call:"Call",comments:"Questions & comments",
commentPlaceholder:"Ask a question about this item...",commentButton:"Add comment",
noComments:"No questions yet.",categories:["Electronics","Furniture & Home","Fashion","Cars","Other"],
invalid:"Please check all fields and the phone number.",
big:"Image exceeds 2 MB. Choose a smaller image."
}
};

function updateLanguage(){
let w=words[lang];
$("language").textContent=w.lang;
["heading","intro","searchTitle","searchButton","formTitle","nameLabel","imageLabel","phoneLabel","priceLabel","categoryLabel","descriptionLabel","publish","notice","latest"].forEach(id=>$(id).textContent=w[id]);
$("search").placeholder=w.search;
$("description").placeholder=lang==="ar"?"اكتب تفاصيل المنتج وحالته...":"Describe the product and its condition...";
$("name").placeholder=lang==="ar"?"مثال: هاتف مستعمل":"e.g. Used phone";
$("phone").placeholder="971501234567";
$("category").innerHTML=w.categories.map((c,i)=>`<option value="${["electronics","furniture","fashion","cars","other"][i]}">${c}</option>`).join("");
document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
render();
}

function render(){
const box=$("products");box.replaceChildren();
const w=words[lang];
const filtered=listings.filter(x=>(x.name+" "+x.description+" "+x.category).toLowerCase().includes(query.toLowerCase()));
if(!filtered.length){const p=document.createElement("p");p.textContent=w.empty;box.appendChild(p);return}
filtered.forEach(item=>{
const card=document.createElement("article");card.className="product";
const img=document.createElement("img");img.src=item.image;img.alt=item.name;
const title=document.createElement("h3");title.textContent=item.name;
const price=document.createElement("div");price.className="price";price.textContent=item.price+" AED";
const desc=document.createElement("p");desc.className="description";desc.textContent=item.description;
const actions=document.createElement("div");actions.className="actions";
const wa=document.createElement("a");wa.className="btn";wa.textContent=w.whatsapp;wa.target="_blank";wa.rel="noopener";
wa.href="https://wa.me/"+item.phone+"?text="+encodeURIComponent(item.name);
const call=document.createElement("a");call.className="btn call";call.textContent=w.call;call.href="tel:"+item.phone;
actions.append(wa,call);
const section=document.createElement("section");section.style.marginTop="15px";
const h=document.createElement("b");h.textContent=w.comments;section.appendChild(h);
const comments=JSON.parse(localStorage.getItem("sq-comments-"+item.id)||"[]");
if(!comments.length){const p=document.createElement("p");p.textContent=w.noComments;section.appendChild(p)}
comments.forEach(c=>{const d=document.createElement("div");d.className="comment";d.textContent=c;section.appendChild(d)});
const form=document.createElement("form");
const input=document.createElement("input");input.placeholder=w.commentPlaceholder;input.required=true;input.maxLength=500;
const submit=document.createElement("button");submit.textContent=w.commentButton;
form.append(input,submit);
form.addEventListener("submit",e=>{
e.preventDefault();
comments.push(input.value.trim());
localStorage.setItem("sq-comments-"+item.id,JSON.stringify(comments));
render();
});
section.appendChild(form);
card.append(img,title,price,desc,actions,section);box.appendChild(card);
});
}

$("language").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";updateLanguage()});
$("searchButton").addEventListener("click",()=>{query=$("search").value.trim();render()});
$("search").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();query=$("search").value.trim();render()}});

$("listingForm").addEventListener("submit",e=>{
e.preventDefault();
const file=$("photo").files[0];
const phone=$("phone").value.replace(/\D/g,"");
if(!file||!phone||phone.length<8){alert(words[lang].invalid);return}
if(file.size>2*1024*1024){alert(words[lang].big);return}
const reader=new FileReader();
reader.onload=()=>{
const item={
id:Date.now(),name:$("name").value.trim(),
price:Number($("price").value),
category:$("category").value,
description:$("description").value.trim(),
phone,image:reader.result
};
listings.unshift(item);
try{localStorage.setItem("souqnaListings",JSON.stringify(listings))}
catch(err){listings.shift();alert("Storage full. Try a smaller photo.");return}
e.target.reset();query="";$("search").value="";render();
};
reader.readAsDataURL(file);
});
updateLanguage();
</script>
</body>
</html>
